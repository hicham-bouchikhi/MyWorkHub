name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate: read VERSION and decide whether this push needs a release. Skips when
  # a tag for the current VERSION already exists (e.g. a re-run, or the version
  # bump commit that this workflow itself pushes back).
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.tag_check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already exists — skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build a self-contained single-file binary for every OS/arch on its native
  # runner, then upload each as a workflow artifact.
  # ---------------------------------------------------------------------------
  build:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish src/MyWorkHub.App/MyWorkHub.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ needs.gate.outputs.version }} \
            -o publish/${{ matrix.rid }} \
            -m:1

      - name: Package archive
        id: pkg
        shell: bash
        run: |
          v="${{ needs.gate.outputs.version }}"
          name="MyWorkHub-$v-${{ matrix.rid }}"
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a "../../$name.zip" ./* >/dev/null
            echo "asset=$name.zip" >> "$GITHUB_OUTPUT"
          else
            # Preserve the executable bit on the single-file binary.
            chmod +x MyWorkHub.App
            tar -czf "../../$name.tar.gz" ./*
            echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ steps.pkg.outputs.asset }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Collect every platform artifact into a single tagged GitHub Release, then
  # bump the patch version and push it back (guarded by [skip ci]).
  # ---------------------------------------------------------------------------
  release:
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: "MyWorkHub v${{ needs.gate.outputs.version }}"
          generate_release_notes: true
          files: dist/*

      - name: Bump patch version
        run: |
          version=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$version"
          new_version="$major.$minor.$((patch + 1))"
          echo "$new_version" > VERSION
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add VERSION
          git commit -m "chore: bump version to $new_version [skip ci]"
          git push
